name: Prism CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "9.0.x"
  NODE_VERSION: "20"

jobs:
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Prism.sln

      - name: Build
        run: dotnet build Prism.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Prism.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/TestResults/*.trx

  backend-format:
    name: Backend Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Check formatting
        run: dotnet format Prism.sln --verify-no-changes --verbosity diagnostic

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Build
        run: npm run build

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm test

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  orval-drift:
    name: Orval Client Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check for Orval drift
        working-directory: frontend
        run: |
          # Snapshot current generated files
          if [ -d src/services/generated ]; then
            cp -r src/services/generated /tmp/orval-before
            # Try to regenerate (requires running backend, so skip if unavailable)
            npx orval 2>/dev/null && {
              if ! diff -rq src/services/generated /tmp/orval-before > /dev/null 2>&1; then
                echo "::error::Orval generated client has drifted. Run 'npm run api:generate' in frontend/ and commit the result."
                diff -r src/services/generated /tmp/orval-before || true
                exit 1
              fi
              echo "Orval client is up to date."
            } || echo "::warning::Orval generation requires running backend. Drift check will be validated manually until OpenAPI spec file is committed."
          else
            echo "::warning::No generated client found. Orval drift check skipped."
          fi

  storybook-build:
    name: Storybook Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Asked of the project, not of the registry. `npx storybook --version` downloads Storybook
      # when it is not installed, so the guard passed on a project that has none — and the build
      # then failed on `.storybook/`'s addons, which are equally absent. Permanently red, for a
      # tool nobody had added yet.
      - name: Build Storybook
        run: |
          if [ -x node_modules/.bin/storybook ]; then
            npm run build-storybook --if-present || npx storybook build --output-dir storybook-static
          else
            echo "::warning::Storybook is not a dependency of this project, so there is nothing to build. Run 'npx storybook@latest init' to add it; this check will activate on its own."
          fi

  playwright-smoke:
    name: Playwright Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The config file and the specs under src/test/playwright were committed; @playwright/test
      # never was. Testing for the config therefore said yes while the runner was missing, and
      # the job died on `Cannot find package '@playwright/test'`. What has to be present is the
      # thing that does the running.
      - name: Run Playwright tests
        run: |
          if [ -d node_modules/@playwright/test ] && [ -f playwright.config.ts ]; then
            npx playwright install --with-deps chromium
            npx playwright test --project=chromium
          else
            echo "::warning::@playwright/test is not a dependency of this project, so the specs under src/test/playwright cannot run. Add it to activate this check."
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - backend-build
      - backend-format
      - frontend-build
      - frontend-test
      - frontend-lint
      - orval-drift
      - storybook-build
      - playwright-smoke
    steps:
      - name: Check results
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Build & Test | ${{ needs.backend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Format | ${{ needs.backend-format.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build & Typecheck | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ${{ needs.frontend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Lint | ${{ needs.frontend-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Orval Drift | ${{ needs.orval-drift.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Storybook Build | ${{ needs.storybook-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Playwright Smoke | ${{ needs.playwright-smoke.result }} |" >> $GITHUB_STEP_SUMMARY

          # Every job gates. A job that cannot fail the build is not a check, it is decoration.
          # openapi-drift was removed for exactly that reason: --export-openapi is not
          # implemented, so it spent two minutes a push building the API and waiting on a server
          # that never exits, to compare nothing. orval-drift, storybook-build and
          # playwright-smoke can still only warn, but each says so on every run and switches
          # itself on the moment its tooling arrives.
          FAILED=""
          for job in "backend-build:${{ needs.backend-build.result }}" \
                     "backend-format:${{ needs.backend-format.result }}" \
                     "frontend-build:${{ needs.frontend-build.result }}" \
                     "frontend-test:${{ needs.frontend-test.result }}" \
                     "frontend-lint:${{ needs.frontend-lint.result }}" \
                     "orval-drift:${{ needs.orval-drift.result }}" \
                     "storybook-build:${{ needs.storybook-build.result }}" \
                     "playwright-smoke:${{ needs.playwright-smoke.result }}"; do
            name="${job%%:*}"; result="${job##*:}"
            if [[ "$result" == "failure" ]] || [[ "$result" == "cancelled" ]]; then
              FAILED="$FAILED $name"
            fi
          done

          if [[ -n "$FAILED" ]]; then
            echo ""
            echo "::error::CI checks failed:$FAILED"
            exit 1
          fi
