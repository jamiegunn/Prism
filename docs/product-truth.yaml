  - id: evaluation
    name: Evaluation
    phase: 3
    promise: "Define suites, deterministic + judge metrics, row-level inspection, leaderboards, calibration, human review"
    current_status: partial
    backend_status: implemented
    backend_notes: >
      Evaluation entities, scoring pipeline and durable job runner. BLEU and ROUGE-L are
      reference-correct ports (sacrebleu 2.6.0 / rouge-score 0.1.2, differential-tested
      to 1e-9), corpus BLEU is computed from pooled statistics, scorer definitions are
      recorded with each run, logprobs are requested and stored, and ECE/Brier
      calibration is computed server-side with hand-proved fixtures. llm_judge runs
      (judge = model under test, stated in its definition). Unknown scorer names are
      rejected at start. Mean scores carry 95% Student-t CIs and model pairs get paired
      two-sided t-tests (pairing by dataset item, failed calls excluded), both
      differential-tested against scipy.stats to 1e-9 with undefined statistics reported
      as absent. Missing: human review workflow.
    frontend_status: implemented
    frontend_notes: >
      List, leaderboard, detail with Summary (definitions shown, missing scores omitted
      rather than drawn as zero, CI ranges on score badges, Model comparisons table with
      p-values that render "< 0.001" rather than a rounded zero and a dash for undefined
      statistics), Records (row-level inspection incl. failures), Calibration
      (reliability diagram + ECE/Brier with prerequisites stated) and export buttons.
      Missing: cost-vs-quality chart, human review mode.
    provider_limitations: >
      Judge-based metrics require inference provider. Cost varies.
    tests_present: false
    release_blockers:
      - Metric implementations (P3-04)
      - Judge provider integration (P3-04)
      - Dashboards (P3-05)
      - Tests (P3-07)

  - id: batch-inference
