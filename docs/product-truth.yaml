  - id: rag
    name: RAG Workbench
    phase: 4
    promise: "Ingest documents, inspect chunking, trace retrieval, grounded citations, compare vector/BM25/hybrid"
    current_status: partial
    backend_status: implemented
    backend_notes: >
      Collection/document/chunk entities with pgvector embeddings; vector, BM25 and
      hybrid search; labelled query sets and a retrieval evaluation endpoint scoring
      all modes with precision@k/recall@k/MRR/nDCG@k (hand-proved, mutation-checked).
      Each collection is searched by the distance metric it was created with — cosine,
      Euclidean and inner product were all offered, stored and then ignored, so every
      search ranked by cosine. Hybrid returns its BM25 half when embedding is
      unavailable, labelled as not being hybrid, and the retrieval evaluation refuses
      to score a fallback as though the method had run.
      Embeddings go to a reachable instance first, then the default — "default, then
      oldest" sent them to an offline seeded vLLM on a fresh install. The sample
      collection is seeded with real embeddings, and retried shortly after startup when
      no server was up in time; it used to be written with null vectors and marked
      Completed, so vector search returned nothing on the only collection a new user
      has. The answer step falls back to the instance's model rather than sending a
      blank one. Missing: chunking strategy preview, citation mapping, query rewrite
      visibility.
    frontend_status: implemented
    frontend_notes: >
      Collection list, document upload, search panel, and an Evaluate tab that builds
      labelled query sets from search results and compares the three modes on rank
      metrics — with per-mode unavailability stated (e.g. null embeddings) instead of
      zero scores. Search & RAG now generates the grounded answer it is named for,
      showing the model, token count and latency above its sources; the endpoint and
      client hook existed but nothing called them, so the tab retrieved and stopped.
      Missing: chunking inspector, citation view.
    provider_limitations: >
      Requires pgvector extension. Embedding model must be available via provider;
      dev.sh provisions it alongside the chat model, which it previously did not.
    tests_present: true
    release_blockers:
      - Chunking preview (P4-02)
      - Retrieval debugger (P4-03)
      - Citation mapping (P4-04)

