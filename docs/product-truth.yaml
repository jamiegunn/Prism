  - id: models
    name: Model Management
    phase: 1
    promise: "Register providers, probe capabilities, health/metrics dashboard, capability matrix, model snapshot history"
    current_status: partial
    backend_status: implemented
    backend_notes: >
      Instance CRUD, health check endpoint, model listing, basic metrics.
      Discovery and the seeded instances address the host correctly from inside a
      container, so a containerised API — the default — finds local servers and does
      not seed two permanently offline rows pointing at itself. Hot-swap capability
      is visible through the recording decorator again, so swapping a model and
      listing an instance's models both work; a direct type test had reported every
      provider as incapable since recording began wrapping them.
      Missing: no IProviderCapabilityRegistry (ADR-015). Capabilities are not probed
      or persisted. No model snapshot history entity.
    frontend_status: implemented
    frontend_notes: >
      Instance cards with status indicators, detail panel, KV cache gauge,
      capability badges. Register instance dialog. Capability matrix view shows
      all instances vs all capabilities (logprobs, tokenize, guided, stream,
      metrics, swap, multimodal, tools) with tier badges. Probe button in detail
      panel triggers live capability detection. Probe errors shown in matrix
      with tooltips. Model snapshot history not yet implemented.
    provider_limitations: >
      Health check and model listing vary by provider. No explicit capability display.
    tests_present: false
    release_blockers:
      - IProviderCapabilityRegistry implementation (P1-02)
      - ModelSnapshot entity and history (P1-07)
      - Capability matrix view (P1-07)
      - Tests needed (P1-09)

  - id: history
    name: History & Replay
    phase: 1
    promise: "Every run recorded, filter/search/tag, replay with overrides, side-by-side diff, trace diff"
    current_status: partial
    backend_status: implemented
    backend_notes: >
      Inference record persistence, list/detail/tag endpoints, replay endpoint, and a
      streaming export endpoint (JSONL/CSV/Parquet) honouring every search filter with
      null-preserving round-trip tests. Tags are a native text[] so the tag filter
      translates (previously 500). Every inference span carries gen_ai.* attributes and
      its trace/span ids are persisted on the record. Streamed calls now retain their
      logprobs, so perplexity/entropy populate for streaming too. A trace endpoint
      (GET /history/{id}/trace) returns the recorded per-token events in position order
      with parsed alternatives, states why a trace is absent, and 404s missing records.
      Replay returns both responses as text, runs the model the record names unless
      overridden, refuses out-of-range overrides and message-less records before
      contacting a provider, and names the model and instance when a provider refuses.
      Missing: replay does not produce a linked ReplayRun entity; no trace-level diff.
    frontend_status: implemented
    frontend_notes: >
      Record list with filtering (search, source, model, date range, success, tags),
      pagination, detail panel with copyable trace/span ids and rendered failure
      messages, tagging, replay button, an Export control that states the row count
      and disables at zero, and a Tokens tab rendering the recorded per-token trace
      (heatmap/entropy/surprise via the shared logprobs panel) with stated absence
      reasons. The replay dialog renders the side-by-side comparison with a
      subsequence-aligned word diff, warns before running when the chosen instance
      serves a different model from the record, and shows the reason a replay failed.
      Missing: trace diff summary.
    provider_limitations: none
    tests_present: true
    release_blockers: []

  - id: prompt-lab
    name: Prompt Lab
    phase: 2
    promise: "Versioned prompts, variables, few-shot examples, A/B testing, links to experiments and evaluations"
    current_status: partial
    backend_status: implemented
    backend_notes: >
      Prompt templates, versions, variants, multimodal support. Handlers for CRUD.
      A fork that names no version takes the latest rather than reporting version 0
      missing; a version whose template uses undeclared variables is refused at
      creation rather than saved and rejected at every run. The model to test with is
      resolved through the shared ModelSelection, so an instance with none recorded
      says so instead of sending a blank model.
      Missing: few-shot block support, A/B test harness, experiment/evaluation linking.
    frontend_status: implemented
    frontend_notes: >
      Template list, version management, variable editor, test panel. Test results sit
      directly under the controls that produce them and are scrolled to on arrival —
      they used to render several hundred pixels below the fold, so running a test
      looked like nothing happening. A remembered template that no longer exists (after
      a reinstall or a reset database) returns the page to its empty state rather than
      opening on "Template not found".
      Missing: few-shot block editor, A/B comparison UI, experiment linking.
    provider_limitations: none
    tests_present: true
    release_blockers:
      - Workspace/Project organization (P2-01)
      - Few-shot blocks (P2-02)
      - Test harness with multi-provider (P2-03)
      - Tests (P2-07)

