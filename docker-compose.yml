services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: prism-postgres
    environment:
      POSTGRES_DB: prism
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5438:5432"
    volumes:
      - prism-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prism-redis
    ports:
      - "6379:6379"
    volumes:
      - prism-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ollama in a container, so nobody has to install anything to get a model.
  #
  # Behind a profile, because whether you want this depends on your machine:
  #
  #   Linux + NVIDIA  the container reaches the GPU and is as fast as native
  #   macOS           it cannot. Docker runs a Linux VM and Metal is not passed
  #                   through, so this is CPU-only and noticeably slower than
  #                   installing Ollama natively. Convenient, not fast.
  #   Windows + WSL2  reaches the GPU through WSL
  #
  # dev.sh sizes and starts this; the limits below are what it passes in.
  ollama:
    image: ollama/ollama:latest
    container_name: prism-ollama
    profiles: [ollama]
    ports:
      - "11434:11434"
    volumes:
      # Named volume so a `docker compose down` does not throw away several
      # gigabytes of downloaded weights.
      - prism-ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: ${PRISM_OLLAMA_KEEP_ALIVE:-5m}
    # Sized by dev.sh from what the container runtime actually has, since on
    # macOS that is the VM's allocation rather than the machine's RAM. Override
    # with PRISM_OLLAMA_MEMORY / PRISM_OLLAMA_CPUS.
    mem_limit: ${PRISM_OLLAMA_MEMORY:-8g}
    cpus: ${PRISM_OLLAMA_CPUS:-4}
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  vllm:
    image: vllm/vllm-openai:latest
    container_name: prism-vllm
    profiles: [gpu]
    environment:
      - MODEL_NAME=${VLLM_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
    command: >
      --model ${VLLM_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      --host 0.0.0.0
      --port 8000
      --max-model-len 4096
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - prism-models:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  prism-ollama-models:
  prism-pgdata:
  prism-redis-data:
  prism-models:
